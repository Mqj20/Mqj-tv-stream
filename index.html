<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050914">
<title>MQJ TV PRO - Xtream Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --bg:#050914;
    --panel:#0b1222;
    --panel2:#0f172a;
    --primary:#00c8ff;
    --blue:#2563eb;
    --purple:#6366f1;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:rgba(148,163,184,.12);
    --green:#22c55e;
    --red:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Cairo,Arial,sans-serif}
body{
    min-height:100vh;color:var(--text);
    background:
      radial-gradient(circle at 8% 5%,rgba(0,200,255,.11),transparent 28%),
      radial-gradient(circle at 95% 10%,rgba(99,102,241,.12),transparent 30%),
      linear-gradient(135deg,#03060d,#07101e 55%,#040711);
}
.header{
    height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;
    background:rgba(4,9,18,.82);backdrop-filter:blur(22px);
    border-bottom:1px solid var(--border);
}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{
    width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    color:var(--primary);font-size:21px;
    background:linear-gradient(135deg,rgba(0,200,255,.16),rgba(99,102,241,.18));
    border:1px solid rgba(0,200,255,.25);box-shadow:0 0 28px rgba(0,200,255,.12)
}
.logo-title{
    font-size:20px;font-weight:900;
    background:linear-gradient(90deg,#fff,#00c8ff,#818cf8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent
}
.logo-sub{font-size:8px;letter-spacing:3px;color:#64748b;display:block}
.status{
    display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:25px;
    background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.18);
    color:#86efac;font-size:10px;font-weight:800
}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.main{
    width:100%;max-width:1800px;margin:auto;padding:22px;
    display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);gap:22px;
    min-height:calc(100vh - 76px)
}
.player-card,.sidebar{
    border:1px solid var(--border);box-shadow:0 25px 80px rgba(0,0,0,.5)
}
.player-card{background:#000;border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.player-wrap{
    position:relative;width:100%;aspect-ratio:16/9;min-height:350px;background:#000
}
.video-js{width:100%!important;height:100%!important}
.video-js .vjs-big-play-button{
    width:70px;height:70px;line-height:66px;border-radius:50%;
    margin-top:-35px;margin-left:-35px;
    background:rgba(0,200,255,.14);border:1px solid rgba(0,200,255,.45)
}
.loading{
    position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    flex-direction:column;background:radial-gradient(circle,rgba(0,200,255,.08),rgba(0,0,0,.96) 65%);
    transition:.25s
}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{
    width:45px;height:45px;border-radius:50%;border:3px solid rgba(255,255,255,.08);
    border-top-color:var(--primary);border-right-color:var(--purple);
    animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:13px;color:#cbd5e1;font-size:11px}
.player-info{
    min-height:82px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(180deg,#0d1628,#080e1b);border-top:1px solid var(--border)
}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.live{
    flex-shrink:0;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;
    background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#f87171;font-size:9px;font-weight:900
}
.live i{font-size:6px}
.active-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px}
.action{
    width:39px;height:39px;border-radius:12px;background:#121d31;border:1px solid var(--border);
    color:#cbd5e1;cursor:pointer;transition:.2s
}
.action:hover{color:var(--primary);border-color:rgba(0,200,255,.35);background:rgba(0,200,255,.08)}
.sidebar{
    min-width:0;background:linear-gradient(145deg,rgba(15,23,42,.94),rgba(7,12,23,.97));
    border-radius:24px;padding:17px;display:flex;flex-direction:column;overflow:hidden
}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.side-title{font-size:15px;font-weight:900;display:flex;align-items:center;gap:9px}
.side-title i{color:var(--primary)}
.count{font-size:9px;color:#67e8f9;padding:5px 10px;border-radius:20px;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.14)}
.search{position:relative;margin-bottom:10px}
.search input{
    width:100%;height:45px;border-radius:14px;outline:none;
    border:1px solid var(--border);background:#050b18;color:#fff;padding:0 42px 0 14px;font-size:11px
}
.search input:focus{border-color:rgba(0,200,255,.4);box-shadow:0 0 0 3px rgba(0,200,255,.05)}
.search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#64748b}
.categories{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{
    flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--border);
    background:#111a2c;color:#94a3b8;cursor:pointer;font-size:9px;font-weight:800
}
.cat.active,.cat:hover{
    color:#fff;border-color:transparent;
    background:linear-gradient(135deg,#0891b2,#4f46e5)
}
.channels{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:7px;padding-left:2px}
.channels::-webkit-scrollbar{width:5px}
.channels::-webkit-scrollbar-thumb{background:#1e293b;border-radius:10px}
.channel{
    display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;
    background:rgba(30,41,59,.28);border:1px solid transparent;cursor:pointer;transition:.2s
}
.channel:hover{background:rgba(30,41,59,.65);transform:translateX(-2px)}
.channel.active{background:linear-gradient(90deg,rgba(0,200,255,.13),rgba(99,102,241,.07));border-color:rgba(0,200,255,.28)}
.channel-logo{
    width:40px;height:40px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;background:linear-gradient(135deg,rgba(0,200,255,.12),rgba(99,102,241,.13));border:1px solid var(--border)
}
.channel-logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.channel-logo i{color:#67e8f9}
.channel-info{min-width:0;flex:1}
.channel-name{display:block;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.channel-meta{display:block;margin-top:2px;color:#64748b;font-size:8px}
.channel-meta .ok{color:#4ade80}
.empty{text-align:center;color:#475569;font-size:11px;padding:50px 10px}
.empty i{font-size:28px;display:block;margin-bottom:10px;color:#334155}
.toast{
    position:fixed;left:50%;bottom:25px;z-index:999;transform:translate(-50%,120px);
    min-width:250px;max-width:90%;padding:12px 18px;text-align:center;
    background:rgba(10,17,31,.96);border:1px solid var(--border);border-radius:14px;
    color:#e2e8f0;font-size:11px;box-shadow:0 20px 60px rgba(0,0,0,.5);transition:.3s
}
.toast.show{transform:translate(-50%,0)}
@media(max-width:1000px){
    .main{grid-template-columns:1fr;padding:12px;gap:13px}
    .sidebar{height:470px}
    .player-wrap{min-height:220px}
}
@media(max-width:600px){
    .header{height:64px;padding:0 13px}
    .logo-icon{width:38px;height:38px}
    .logo-title{font-size:16px}
    .logo-sub{font-size:7px}
    .status{padding:6px 9px;font-size:8px}
    .main{padding:8px}
    .player-card,.sidebar{border-radius:18px}
    .player-wrap{min-height:200px}
    .player-info{min-height:68px;padding:11px}
    .active-name{font-size:12px}
    .action{width:35px;height:35px}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <div class="logo-icon"><i class="fa-solid fa-satellite-dish"></i></div>
        <div>
            <div class="logo-title">MQJ TV PRO</div>
            <span class="logo-sub">XTREAM PLAYER</span>
        </div>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        <span id="statusText">جاري الاتصال</span>
    </div>
</header>

<main class="main">

    <section class="player-card">
        <div class="player-wrap">

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text" id="loadingText">جاري الاتصال بـ GO TV MAX...</div>
            </div>

            <video id="videoPlayer"
                   class="video-js vjs-default-skin vjs-big-play-centered"
                   controls playsinline preload="auto"></video>
        </div>

        <div class="player-info">
            <div class="now">
                <span class="live"><i class="fa-solid fa-circle"></i> LIVE</span>
                <span class="active-name" id="activeName">اختر قناة لتشغيلها</span>
            </div>

            <div class="actions">
                <button class="action" onclick="reloadCurrent()" title="إعادة الاتصال">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="action" onclick="fullscreenPlayer()" title="ملء الشاشة">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>
    </section>

    <aside class="sidebar">
        <div class="side-head">
            <div class="side-title"><i class="fa-solid fa-tv"></i> القنوات المباشرة</div>
            <div class="count" id="count">0 قناة</div>
        </div>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search" type="text" placeholder="ابحث عن قناة..." autocomplete="off">
        </div>

        <div class="categories" id="categories"></div>

        <div class="channels" id="channels">
            <div class="empty">
                <i class="fa-solid fa-spinner fa-spin"></i>
                جاري تحميل القنوات...
            </div>
        </div>
    </aside>
</main>

<div class="toast" id="toast"></div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<script>
/*
 * GO TV MAX
 * البيانات التي زودتني بها
 */
const XTREAM = {
    host: "https://go-tv.site:443",
    username: "gotv",
    password: "12345"
};

let player = null;
let hls = null;
let channels = [];
let categories = [];
let currentCategory = "all";
let currentChannel = null;
let currentFormatIndex = 0;
let playToken = 0;

const $ = id => document.getElementById(id);

const loading = $("loading");
const loadingText = $("loadingText");
const activeName = $("activeName");
const channelsBox = $("channels");
const categoriesBox = $("categories");
const search = $("search");
const count = $("count");
const statusText = $("statusText");
const toast = $("toast");

function apiUrl(action = "") {
    let u = XTREAM.host.replace(/\/+$/, "") +
        "/player_api.php?username=" +
        encodeURIComponent(XTREAM.username) +
        "&password=" +
        encodeURIComponent(XTREAM.password);

    if (action) u += "&action=" + encodeURIComponent(action);
    return u;
}

function streamUrls(channel) {
    const base = XTREAM.host.replace(/\/+$/, "");
    const user = encodeURIComponent(XTREAM.username);
    const pass = encodeURIComponent(XTREAM.password);
    const id = encodeURIComponent(channel.stream_id);

    /*
     * معظم لوحات Xtream توفر .ts و .m3u8.
     * نبدأ بـ TS لأنه الأكثر شيوعاً للبث المباشر،
     * ثم نجرب HLS إذا فشل.
     */
    return [
        {
            url: `${base}/live/${user}/${pass}/${id}.ts`,
            type: "video/mp2t",
            label: "TS"
        },
        {
            url: `${base}/live/${user}/${pass}/${id}.m3u8`,
            type: "application/x-mpegURL",
            label: "HLS"
        }
    ];
}

function showLoading(show, text = "جاري التحميل...") {
    loadingText.textContent = text;
    loading.classList.toggle("hidden", !show);
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
}

function setStatus(text, ok = true) {
    statusText.textContent = text;
    const dot = document.querySelector(".status-dot");
    dot.style.background = ok ? "#22c55e" : "#ef4444";
    dot.style.boxShadow = ok ? "0 0 12px #22c55e" : "0 0 12px #ef4444";
}

document.addEventListener("DOMContentLoaded", async () => {
    player = videojs("videoPlayer", {
        controls: true,
        responsive: true,
        fluid: true,
        liveui: true,
        preload: "auto"
    });

    await connectXtream();
});

search.addEventListener("input", filterChannels);

async function connectXtream() {
    showLoading(true, "جاري الاتصال بـ GO TV MAX...");

    try {
        const response = await fetch(apiUrl(), { cache: "no-store" });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();

        if (!data || !data.user_info) {
            throw new Error("استجابة Xtream غير صحيحة");
        }

        if (String(data.user_info.auth) === "0") {
            throw new Error("بيانات الدخول مرفوضة");
        }

        setStatus("متصل بـ GO TV MAX", true);

        await loadCategories();
        await loadChannels();

        showToast("تم الاتصال وتحميل القنوات بنجاح");
    } catch (err) {
        console.error(err);
        setStatus("تعذر الاتصال", false);

        channelsBox.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-triangle-exclamation"></i>
                تعذر تحميل القنوات
                <br><br>
                <small>${escapeHtml(err.message)}</small>
            </div>`;
        showToast("تعذر الاتصال بالسيرفر");
    } finally {
        showLoading(false);
    }
}

async function loadCategories() {
    const r = await fetch(apiUrl("get_live_categories"), { cache: "no-store" });
    if (!r.ok) throw new Error("فشل تحميل التصنيفات");

    const data = await r.json();
    categories = Array.isArray(data) ? data : [];
    renderCategories();
}

async function loadChannels() {
    showLoading(true, "جاري تحميل القنوات...");

    const r = await fetch(apiUrl("get_live_streams"), { cache: "no-store" });
    if (!r.ok) throw new Error("فشل تحميل القنوات");

    const data = await r.json();
    channels = Array.isArray(data) ? data : [];

    renderCategories();
    filterChannels();

    if (channels.length) {
        setTimeout(() => playChannel(channels[0]), 250);
    }
}

function renderCategories() {
    categoriesBox.innerHTML = "";

    const all = document.createElement("button");
    all.className = "cat" + (currentCategory === "all" ? " active" : "");
    all.textContent = "الكل";
    all.onclick = () => {
        currentCategory = "all";
        renderCategories();
        filterChannels();
    };
    categoriesBox.appendChild(all);

    categories.forEach(cat => {
        const id = String(cat.category_id);
        const b = document.createElement("button");
        b.className = "cat" + (currentCategory === id ? " active" : "");
        b.textContent = cat.category_name || "تصنيف";
        b.onclick = () => {
            currentCategory = id;
            renderCategories();
            filterChannels();
        };
        categoriesBox.appendChild(b);
    });
}

function filterChannels() {
    const q = search.value.trim().toLowerCase();

    const filtered = channels.filter(ch => {
        const name = String(ch.name || "").toLowerCase();
        const catOk = currentCategory === "all" ||
            String(ch.category_id) === currentCategory;
        return catOk && name.includes(q);
    });

    count.textContent = filtered.length + " قناة";
    renderChannels(filtered);
}

function renderChannels(list) {
    channelsBox.innerHTML = "";

    if (!list.length) {
        channelsBox.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-tv"></i>
                لا توجد قنوات مطابقة
            </div>`;
        return;
    }

    list.forEach(ch => {
        const item = document.createElement("div");
        item.className = "channel";

        if (currentChannel &&
            String(currentChannel.stream_id) === String(ch.stream_id)) {
            item.classList.add("active");
        }

        const logo = document.createElement("div");
        logo.className = "channel-logo";

        if (ch.stream_icon) {
            const img = document.createElement("img");
            img.src = ch.stream_icon;
            img.alt = "";
            img.onerror = () => {
                logo.innerHTML = '<i class="fa-solid fa-tv"></i>';
            };
            logo.appendChild(img);
        } else {
            logo.innerHTML = '<i class="fa-solid fa-tv"></i>';
        }

        const info = document.createElement("div");
        info.className = "channel-info";

        const name = document.createElement("span");
        name.className = "channel-name";
        name.textContent = ch.name || "قناة";

        const meta = document.createElement("span");
        meta.className = "channel-meta";
        meta.innerHTML = '<span class="ok">● مباشر</span>';

        info.append(name, meta);
        item.append(logo, info);

        item.onclick = () => {
            document.querySelectorAll(".channel").forEach(x => x.classList.remove("active"));
            item.classList.add("active");
            playChannel(ch);
        };

        channelsBox.appendChild(item);
    });
}

function destroyHls() {
    if (hls) {
        try { hls.destroy(); } catch(e) {}
        hls = null;
    }
}

function playChannel(channel) {
    if (!channel || !player) return;

    currentChannel = channel;
    currentFormatIndex = 0;
    const token = ++playToken;

    activeName.textContent = channel.name || "قناة";
    showLoading(true, "جاري تشغيل " + (channel.name || "القناة") + "...");

    destroyHls();
    player.pause();

    const formats = streamUrls(channel);
    tryFormat(formats, 0, token);
}

function tryFormat(formats, index, token) {
    if (token !== playToken) return;

    if (index >= formats.length) {
        showLoading(false);
        setStatus("البث غير متاح", false);
        showToast("تعذر تشغيل القناة من هذا المتصفح");
        return;
    }

    currentFormatIndex = index;
    const source = formats[index];

    /*
     * HLS.js مطلوب لملفات m3u8 في أغلب متصفحات Android/Chrome.
     */
    if (source.type === "application/x-mpegURL") {
        if (window.Hls && Hls.isSupported()) {
            destroyHls();

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 30,
                maxBufferLength: 20,
                liveSyncDurationCount: 3
            });

            hls.on(Hls.Events.MEDIA_ATTACHED, () => {
                if (token !== playToken) return;
                hls.loadSource(source.url);
            });

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if (token !== playToken) return;
                showLoading(false);
                setStatus("البث يعمل", true);
                player.play().catch(() => {});
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
                if (token !== playToken || !data.fatal) return;

                destroyHls();

                if (index + 1 < formats.length) {
                    showLoading(true, "تجربة صيغة بث أخرى...");
                    setTimeout(() => tryFormat(formats, index + 1, token), 250);
                } else {
                    showLoading(false);
                    setStatus("تعذر تشغيل البث", false);
                    showToast("السيرفر رفض تشغيل البث أو البث غير متاح");
                }
            });

            hls.attachMedia(player.tech().el());
            return;
        }

        /*
         * Safari / iOS وبعض المتصفحات التي تدعم HLS أصلياً.
         */
        if (player.tech().el().canPlayType("application/vnd.apple.mpegurl")) {
            setVideoJsSource(source, formats, index, token);
            return;
        }

        if (index + 1 < formats.length) {
            tryFormat(formats, index + 1, token);
            return;
        }
    }

    setVideoJsSource(source, formats, index, token);
}

function setVideoJsSource(source, formats, index, token) {
    player.off("loadedmetadata");
    player.off("canplay");
    player.off("error");

    player.src({
        src: source.url,
        type: source.type
    });

    const onReady = () => {
        if (token !== playToken) return;
        showLoading(false);
        setStatus("البث يعمل", true);
        player.play().catch(() => {});
    };

    const onError = () => {
        if (token !== playToken) return;

        player.off("loadedmetadata", onReady);
        player.off("canplay", onReady);
        player.off("error", onError);

        if (index + 1 < formats.length) {
            showLoading(true, "تجربة صيغة بث أخرى...");
            setTimeout(() => tryFormat(formats, index + 1, token), 250);
        } else {
            showLoading(false);
            setStatus("تعذر تشغيل البث", false);
            showToast("No compatible source: تحقق من صيغة البث أو CORS");
        }
    };

    player.one("loadedmetadata", onReady);
    player.one("canplay", onReady);
    player.one("error", onError);

    player.load();
}

function reloadCurrent() {
    if (!currentChannel) {
        showToast("اختر قناة أولاً");
        return;
    }
    playChannel(currentChannel);
}

function fullscreenPlayer() {
    if (!player) return;

    if (player.isFullscreen()) {
        player.exitFullscreen();
    } else {
        player.requestFullscreen();
    }
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
</script>
