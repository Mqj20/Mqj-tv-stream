<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQJ TV PRO - Maven IPTV</title>
    
    <!-- Video.js CSS & FontAwesome -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0e17;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 800;
        }
        .logo i {
            color: #38bdf8;
            font-size: 2rem;
        }
        .logo span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .file-status {
            font-size: 0.8rem;
            color: #38bdf8;
            padding: 6px 14px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 30px;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        .main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 100px);
            min-height: 500px;
        }

        .player-section {
            flex: 3;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(56, 189, 248, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .video-wrapper {
            flex: 1;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .video-js {
            width: 100% !important;
            height: 100% !important;
        }

        .channel-bar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(56, 189, 248, 0.08);
            flex-wrap: wrap;
            gap: 8px;
        }
        .channel-bar .live-tag {
            background: #ef4444;
            color: #fff;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .channel-bar .channel-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            margin: 0 12px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar {
            flex: 1.1;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(56, 189, 248, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 260px;
            max-height: 100%;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i { color: #38bdf8; }
        .sidebar-header .count {
            font-size: 0.7rem;
            background: #1e293b;
            padding: 2px 12px;
            border-radius: 30px;
            color: #94a3b8;
        }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #1e293b;
            border-radius: 40px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #38bdf8;
        }
        .search-box i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 6px;
            scrollbar-width: thin;
        }
        .cat-btn {
            background: transparent;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #fff;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
            margin-top: 4px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: #334155;
        }
        .channel-item.active {
            background: rgba(14, 165, 233, 0.15);
            border-color: #0ea5e9;
        }
        .channel-item .info .name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #f1f5f9;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-bolt"></i>
            <span>MQJ TV PRO</span>
        </div>
        <div>
            <span class="file-status" id="fileStatus"><i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال بالسيرفر...</span>
        </div>
    </header>

    <div class="main">
        <section class="player-section">
            <div class="video-wrapper">
                <video id="videoPlayer" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline></video>
            </div>
            <div class="channel-bar">
                <span class="live-tag"><i class="fa-solid fa-circle"></i> LIVE</span>
                <span class="channel-name" id="activeChannelName">اختر قناة لتشغيلها</span>
            </div>
        </section>

        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-list-ul"></i> القنوات</h3>
                <span class="count" id="channelCount">0</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن قناة..." oninput="filterChannels()">
            </div>
            <div class="category-filter" id="categoryFilter"></div>
            <div class="channels-list" id="channelsList"></div>
        </aside>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        const activeName = document.getElementById('activeChannelName');
        const channelsList = document.getElementById('channelsList');
        const categoryFilter = document.getElementById('categoryFilter');
        const searchInput = document.getElementById('searchInput');
        const fileStatus = document.getElementById('fileStatus');

        let player = null;
        let allChannels = [];
        let currentCategory = 'الكل';

        // بيانات السيرفر الجديد
        const xtreamServer = {
            url: 'http://sansatplus.net:88',
            user: 'GvDEv9CPNCnm0gO',
            pass: 'HTGbJ8jjLAdaAvc'
        };

        const proxy = url => 'https://corsproxy.io/?' + encodeURIComponent(url);

        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('videoPlayer', { autoplay: true, controls: true, responsive: true, fluid: true });
            loadXtreamChannels();
        });

        async function loadXtreamChannels() {
            try {
                const apiUrl = `${xtreamServer.url}/player_api.php?username=${xtreamServer.user}&password=${xtreamServer.pass}&action=get_live_streams`;
                const response = await fetch(proxy(apiUrl));
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    allChannels = data.map(ch => ({
                        name: ch.name,
                        url: `${xtreamServer.url}/live/${xtreamServer.user}/${xtreamServer.pass}/${ch.stream_id}.m3u8`,
                        group: ch.category_name || 'عام'
                    }));

                    fileStatus.innerHTML = `<i class="fa-regular fa-circle-check"></i> تم جلب ${allChannels.length} قناة من سيرفر Maven`;
                    renderCategories();
                    filterChannels();
                    
                    playChannel(allChannels[0].url, allChannels[0].name);
                } else {
                    fileStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> خطأ في البيانات أو الاشتراك منتهي`;
                }
            } catch (error) {
                console.error("خطأ في الاتصال:", error);
                fileStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> تعذر الاتصال بالسيرفر`;
            }
        }

        function renderCategories() {
            const categories = ['الكل', ...new Set(allChannels.map(c => c.group))];
            categoryFilter.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterChannels();
                };
                categoryFilter.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allChannels.filter(ch => {
                const matchCat = currentCategory === 'الكل' || ch.group === currentCategory;
                const matchName = ch.name.toLowerCase().includes(query);
                return matchCat && matchName;
            });
            renderChannels(filtered);
            document.getElementById('channelCount').textContent = filtered.length;
        }

        function renderChannels(channels) {
            channelsList.innerHTML = '';
            if (channels.length === 0) {
                channelsList.innerHTML = `<div class="empty-state">لا توجد قنوات مطابقة</div>`;
                return;
            }
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (index === 0) item.classList.add('active');
                item.innerHTML = `<div class="info"><span class="name">${ch.name}</span></div>`;
                item.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playChannel(ch.url, ch.name);
                };
                channelsList.appendChild(item);
            });
        }

        function playChannel(url, name) {
            activeName.textContent = name;
            if (player) {
                player.src({ src: proxy(url), type: 'application/x-mpegURL' });
                player.play().catch(e => console.log("تنبيه التشغيل:", e));
            }
        }
    </script>
</body>
</html>
