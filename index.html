            { name: 'France 24 English', url: 'https://f24-live-english.akamaized.net/hls/live/2006678/F24_EN_1/index.m3u8', group: 'أخبار' },
            { name: 'Al Arabiya Al Hadath', url: 'https://av.alarabiya.net/alarabiapublish/alhadath.smil/playlist.m3u8', group: 'أخبار' },

            // ===== قنوات فرنسية =====
            { name: 'TF1 (France)', url: 'https://tf1-lh.akamaihd.net/i/tf1_1@61143/index_3_av-p.m3u8', group: 'فرنسية' },

            // ===== متنوعة =====
            { name: 'Bloomberg TV', url: 'https://liveproduseast.akamaized.net/us/Channel-USTV-AWS-MultiBitrate/HLS_Live_500K.m3u8', group: 'اقتصاد' },
            { name: 'NASA TV', url: 'https://ntv1.akamaized.net/hls/live/2013875/NASA-NTV1-HLS/master_1080.m3u8', group: 'علوم' },
            { name: 'الجزيرة الوثائقية', url: 'https://live-hls-web-ajd.akamaized.net/hls/live/2018285/ajd/index.m3u8', group: 'وثائقي' },
        ];

        // ======================== LOAD CHANNELS ========================
        function loadChannels(channels) {
            allChannels = channels;
            renderCategories();
            filterChannels();
            document.getElementById('channelCount').textContent = channels.length;
            if (channels.length > 0) {
                playChannel(channels[0].url, channels[0].name, channels[0].group);
            } else {
                activeName.textContent = 'لا توجد قنوات';
                activeGroup.textContent = '-';
            }
        }

        // ======================== PARSE M3U ========================
        function parseM3U(text) {
            const lines = text.split(/\r?\n/);
            const channels = [];
            let currentName = '';
            let currentGroup = 'Général';
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameMatch = line.match(/,([^,]+)$/);
                    if (nameMatch) currentName = nameMatch[1].trim();
                    const groupMatch = line.match(/group-title="([^"]+)"/);
                    if (groupMatch) currentGroup = groupMatch[1].trim();
                } else if (line && !line.startsWith('#') && currentName) {
                    channels.push({ name: currentName, url: line, group: currentGroup || 'Général' });
                    currentName = '';
                }
            });
            return channels;
        }

        // ======================== RENDER ========================
        function renderCategories() {
            const categories = ['الكل', ...new Set(allChannels.map(c => c.group || 'Général'))];
            categoryFilter.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.dataset.cat = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterChannels();
                };
                categoryFilter.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allChannels.filter(ch => {
                const matchCat = currentCategory === 'الكل' || ch.group === currentCategory;
                const matchName = ch.name.toLowerCase().includes(query);
                return matchCat && matchName;
            });
            renderChannels(filtered);
            document.getElementById('channelCount').textContent = filtered.length;
        }

        function renderChannels(channels) {
            channelsList.innerHTML = '';
            if (channels.length === 0) {
                channelsList.innerHTML =
                    `<div class="empty-state"><i class="fa-regular fa-circle-xmark"></i>لا توجد قنوات تطابق البحث</div>`;
                return;
            }
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (index === 0) item.classList.add('active');
                item.innerHTML = `
                    <span class="icon"><i class="fa-solid fa-tower-broadcast"></i></span>
                    <div class="info">
                        <span class="name">${ch.name}</span>
                        <span class="group">${ch.group || 'Général'}</span>
                    </div>
                    <span class="play-icon"><i class="fa-solid fa-circle-play"></i></span>
                `;
                item.onclick = () => playChannel(ch.url, ch.name, ch.group, item);
                channelsList.appendChild(item);
            });
        }

        // ======================== PLAY CHANNEL ========================
        function playChannel(url, name, group, element = null) {
            activeName.textContent = name;
            activeGroup.textContent = group || '-';
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            currentUrl = url;
            retryCount = 0;
            loadingOverlay.classList.add('show');

            // تدمير الجلسة القديمة
            if (hls) {
                hls.destroy();
                hls = null;
            }

            // اختيار وضع التشغيل
            if (currentPlayerMode === 'hls' && Hls.isSupported()) {
                playWithHls(url);
            } else {
                playNative(url);
            }
        }

        function playWithHls(url) {
            try {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingOverlay.classList.remove('show');
                    video.play().catch(() => {});
                });
                hls.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal && retryCount < 3) {
                        retryCount++;
                        console.warn(`⚠️ إعادة محاولة HLS (${retryCount})...`);
                        hls.destroy();
                        hls = null;
                        setTimeout(() => {
                            if (currentPlayerMode === 'hls') playWithHls(currentUrl);
                            else playNative(currentUrl);
                        }, 1500);
                    } else if (data.fatal) {
                        // Fallback للملفات المباشرة
                        hls.destroy();
                        hls = null;
                        playNative(currentUrl);
                    }
                });
            } catch (e) {
                console.warn('⚠️ فشل HLS، التبديل إلى التشغيل المباشر');
                playNative(currentUrl);
            }
        }

        function playNative(url) {
            video.src = url;
            video.load();
            video.play().then(() => {
                loadingOverlay.classList.remove('show');
            }).catch(() => {
                loadingOverlay.classList.remove('show');
                console.warn('⚠️ تعذر تشغيل القناة مباشرة');
            });
        }

        // ======================== تبديل المشغل ========================
        function setPlayerMode(mode) {
            currentPlayerMode = mode;
            document.getElementById('playerHls').classList.toggle('active', mode === 'hls');
            document.getElementById('playerNative').classList.toggle('active', mode === 'native');

            // إعادة تشغيل القناة الحالية بالوضع الجديد
            if (currentUrl) {
                playChannel(currentUrl, activeName.textContent, activeGroup.textContent);
            }
        }

        // ======================== FILE UPLOAD ========================
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const parsed = parseM3U(event.target.result);
                if (parsed.length === 0) {
                    alert('⚠️ لم يتم العثور على قنوات صالحة.');
                    return;
                }
                loadChannels(parsed);
                fileStatus.innerHTML = `<i class="fa-regular fa-circle-check"></i> ${file.name} (${parsed.length} قناة)`;
                fileInput.value = '';
            };
            reader.readAsText(file);
        });

        // ======================== INIT ========================
        loadChannels(sportsChannels);
        fileStatus.innerHTML = `<i class="fa-regular fa-circle-check"></i> ${sportsChannels.length} قناة رياضية`;

        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length && (files[0].name.endsWith('.m3u') || files[0].name.endsWith('.m3u8'))) {
                fileInput.files = files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });

        console.log('✅ MQJ TV PRO - 65+ قناة رياضية جاهزة!');
        console.log('💡 يمكنك التبديل بين HLS والتشغيل المباشر عبر الأزرار في شريط القناة.');
    </script>
</body>
</html>
