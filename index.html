<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQJ TV PRO - Video.js Edition</title>
    
    <!-- Video.js CSS & FontAwesome -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0e17;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            padding: 14px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(56, 189, 248, 0.15);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 800;
        }
        .logo i {
            color: #38bdf8;
            font-size: 2rem;
        }
        .logo span {
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .upload-btn {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.35);
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(14, 165, 233, 0.5);
        }
        #m3uInput {
            display: none;
        }

        .file-status {
            font-size: 0.8rem;
            color: #94a3b8;
            padding: 6px 14px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 30px;
            border: 1px solid #334155;
            white-space: nowrap;
        }

        .main {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 24px;
            max-width: 1800px;
            margin: 0 auto;
            width: 100%;
            height: calc(100vh - 100px);
            min-height: 500px;
        }

        .player-section {
            flex: 3;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(56, 189, 248, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .video-wrapper {
            flex: 1;
            background: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* تخصيص مظهر Video.js */
        .video-js {
            width: 100% !important;
            height: 100% !important;
        }
        .vjs-theme-custom .vjs-big-play-button {
            background-color: rgba(14, 165, 233, 0.8) !important;
            border: none !important;
            border-radius: 50% !important;
            width: 2em !important;
            height: 2em !important;
            line-height: 2em !important;
            margin-top: -1em !important;
            margin-left: -1em !important;
        }

        .channel-bar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(56, 189, 248, 0.08);
            flex-wrap: wrap;
            gap: 8px;
        }
        .channel-bar .live-tag {
            background: #ef4444;
            color: #fff;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .channel-bar .channel-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
            margin: 0 12px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-bar .channel-group {
            font-size: 0.75rem;
            color: #94a3b8;
            background: rgba(51, 65, 85, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .sidebar {
            flex: 1.1;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(56, 189, 248, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 260px;
            max-height: 100%;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .sidebar-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sidebar-header h3 i { color: #38bdf8; }
        .sidebar-header .count {
            font-size: 0.7rem;
            background: #1e293b;
            padding: 2px 12px;
            border-radius: 30px;
            color: #94a3b8;
        }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #1e293b;
            border-radius: 40px;
            color: #f1f5f9;
            font-size: 0.9rem;
            outline: none;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        .search-box i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 6px;
            scrollbar-width: thin;
        }
        .category-filter::-webkit-scrollbar { height: 3px; }
        .category-filter::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        
        .cat-btn {
            background: transparent;
            border: 1px solid #1e293b;
            color: #94a3b8;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #fff;
            box-shadow: 0 0 16px rgba(14, 165, 233, 0.2);
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
            margin-top: 4px;
        }
        .channels-list::-webkit-scrollbar { width: 4px; }
        .channels-list::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(30, 41, 59, 0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(30, 41, 59, 0.7);
            border-color: #334155;
        }
        .channel-item.active {
            background: rgba(14, 165, 233, 0.15);
            border-color: #0ea5e9;
        }
        .channel-item .icon {
            color: #38bdf8;
            font-size: 0.9rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .channel-item .info {
            flex: 1;
            min-width: 0;
        }
        .channel-item .info .name {
            font-size: 0.85rem;
            font-weight: 500;
            color: #f1f5f9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .info .group {
            font-size: 0.6rem;
            color: #64748b;
            display: block;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 10px;
            color: #64748b;
            font-size: 0.9rem;
        }

        @media (max-width: 992px) {
            .main {
                flex-direction: column;
                height: auto;
                padding: 12px;
                gap: 16px;
            }
            .sidebar { max-height: 420px; min-width: unset; }
            .player-section { min-height: 300px; }
            .header { padding: 10px 16px; }
            .logo { font-size: 1.2rem; }
            .upload-btn span { display: none; }
            .upload-btn { padding: 8px 14px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-bolt"></i>
            <span>MQJ TV PRO</span>
        </div>
        <div class="header-actions">
            <span class="file-status" id="fileStatus"><i class="fa-regular fa-circle-check"></i> جاهز لتشغيل القنوات</span>
            <label class="upload-btn" for="m3uInput">
                <i class="fa-solid fa-upload"></i>
                <span>رفع M3U</span>
            </label>
            <input type="file" id="m3uInput" accept=".m3u,.m3u8">
        </div>
    </header>

    <div class="main">
        <!-- PLAYER SECTION -->
        <section class="player-section">
            <div class="video-wrapper">
                <video 
                    id="videoPlayer" 
                    class="video-js vjs-default-skin vjs-big-play-centered vjs-theme-custom" 
                    controls 
                    preload="auto" 
                    playsinline>
                </video>
            </div>
            <div class="channel-bar">
                <span class="live-tag"><i class="fa-solid fa-circle"></i> LIVE</span>
                <span class="channel-name" id="activeChannelName">اختر قناة لتشغيلها</span>
                <span class="channel-group" id="activeChannelGroup">-</span>
            </div>
        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-list-ul"></i> القنوات</h3>
                <span class="count" id="channelCount">0</span>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن قناة..." oninput="filterChannels()">
            </div>
            <div class="category-filter" id="categoryFilter"></div>
            <div class="channels-list" id="channelsList"></div>
        </aside>
    </div>

    <!-- Video.js Library -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // ======================== GLOBALS ========================
        const activeName = document.getElementById('activeChannelName');
        const activeGroup = document.getElementById('activeChannelGroup');
        const channelsList = document.getElementById('channelsList');
        const categoryFilter = document.getElementById('categoryFilter');
        const searchInput = document.getElementById('searchInput');
        const fileStatus = document.getElementById('fileStatus');
        const fileInput = document.getElementById('m3uInput');

        let player = null;
        let allChannels = [];
        let currentCategory = 'الكل';

        // تهيئة مشغل Video.js
        document.addEventListener('DOMContentLoaded', () => {
            player = videojs('videoPlayer', {
                autoplay: true,
                controls: true,
                liveui: true,
                responsive: true,
                fluid: true
            });

            loadChannels(defaultChannels);
        });

        // ======================== قنوات افتراضية معتمدة ========================
        const defaultChannels = [
            { name: 'beIN SPORTS News', url: 'https://beinsports-ak.akamaized.net/hls/live/2008540/beinsportsnews/beinsportsnews.m3u8', group: 'beIN Sports' },
            { name: 'Red Bull TV', url: 'https://rbmn-live.akamaized.net/hls/live/590964/RBTV_A1/master.m3u8', group: 'رياضة عالمية' },
            { name: 'الجزيرة الإخبارية', url: 'https://live-hls-web-aje.akamaized.net/hls/live/2018284/aje/index.m3u8', group: 'أخبار' },
            { name: 'سكاي نيوز عربية', url: 'https://skynewsarabia-aka.akamaized.net/hls/live/2017807/SNA_MASTER_1080_25_adaptive.m3u8', group: 'أخبار' },
            { name: 'فرانس 24 (FR)', url: 'https://f24-live-francais.akamaized.net/hls/live/2006679/F24_FR_1/index.m3u8', group: 'أخبار' },
            { name: 'الجزيرة الوثائقية', url: 'https://live-hls-web-ajd.akamaized.net/hls/live/2018285/ajd/index.m3u8', group: 'وثائقي' }
        ];

        // ======================== إدارة القنوات ========================
        function loadChannels(channels) {
            allChannels = channels;
            renderCategories();
            filterChannels();
            document.getElementById('channelCount').textContent = channels.length;
            if (channels.length > 0) {
                playChannel(channels[0].url, channels[0].name, channels[0].group);
            }
        }

        function renderCategories() {
            const categories = ['الكل', ...new Set(allChannels.map(c => c.group || 'عام'))];
            categoryFilter.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterChannels();
                };
                categoryFilter.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allChannels.filter(ch => {
                const matchCat = currentCategory === 'الكل' || ch.group === currentCategory;
                const matchName = ch.name.toLowerCase().includes(query);
                return matchCat && matchName;
            });
            renderChannels(filtered);
            document.getElementById('channelCount').textContent = filtered.length;
        }

        function renderChannels(channels) {
            channelsList.innerHTML = '';
            if (channels.length === 0) {
                channelsList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-circle-xmark"></i> لا توجد قنوات</div>`;
                return;
            }
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (index === 0) item.classList.add('active');
                item.innerHTML = `
                    <span class="icon"><i class="fa-solid fa-tv"></i></span>
                    <div class="info">
                        <span class="name">${ch.name}</span>
                        <span class="group">${ch.group || 'عام'}</span>
                    </div>
                `;
                item.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playChannel(ch.url, ch.name, ch.group);
                };
                channelsList.appendChild(item);
            });
        }

        // ======================== تشغيل القناة (Video.js) ========================
        function playChannel(url, name, group) {
            activeName.textContent = name;
            activeGroup.textContent = group || '-';

            // معالجة قيود HTTP
            let finalUrl = url;
            if (url.startsWith('http://')) {
                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
            }

            if (player) {
                player.src({
                    src: finalUrl,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(err => {
                    console.warn("إشعار التشغيل التلقائي:", err);
                });
            }
        }

        // ======================== قراءة ملف M3U ========================
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split(/\r?\n/);
                const channels = [];
                let currentName = '';
                let currentGroup = 'عام';

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,([^,]+)$/);
                        if (nameMatch) currentName = nameMatch[1].trim();
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        if (groupMatch) currentGroup = groupMatch[1].trim();
                    } else if (line && !line.startsWith('#') && currentName) {
                        channels.push({ name: currentName, url: line, group: currentGroup });
                        currentName = '';
                    }
                });

                if (channels.length > 0) {
                    loadChannels(channels);
                    fileStatus.innerHTML = `<i class="fa-regular fa-circle-check"></i> تم تحميل ${channels.length} قناة`;
                } else {
                    alert('لم يتم العثور على قنوات صالحة داخل الملف.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
