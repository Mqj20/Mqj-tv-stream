                    console.warn('جاري تجربة الرابط المباشر بدون بروكسي كخيار أخير');
                    player.src({ src: currentOriginalUrl, type: 'application/x-mpegURL' });
                    player.play();
                }
            });

            loadChannels(sportsChannels);
        });

        function loadChannels(channels) {
            allChannels = channels;
            renderCategories();
            filterChannels();
            document.getElementById('channelCount').textContent = channels.length;
            if (channels.length > 0) {
                playChannel(channels[0].url, channels[0].name, channels[0].group);
            }
        }

        function renderCategories() {
            const categories = ['الكل', ...new Set(allChannels.map(c => c.group || 'Général'))];
            categoryFilter.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn ${cat === 'الكل' ? 'active' : ''}`;
                btn.textContent = cat;
                btn.onclick = () => {
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    filterChannels();
                };
                categoryFilter.appendChild(btn);
            });
        }

        function filterChannels() {
            const query = searchInput.value.toLowerCase().trim();
            const filtered = allChannels.filter(ch => {
                const matchCat = currentCategory === 'الكل' || ch.group === currentCategory;
                const matchName = ch.name.toLowerCase().includes(query);
                return matchCat && matchName;
            });
            renderChannels(filtered);
            document.getElementById('channelCount').textContent = filtered.length;
        }

        function renderChannels(channels) {
            channelsList.innerHTML = '';
            if (channels.length === 0) {
                channelsList.innerHTML = `<div class="empty-state"><i class="fa-regular fa-circle-xmark"></i> لا توجد قنوات تطابق البحث</div>`;
                return;
            }
            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                if (index === 0) item.classList.add('active');
                item.innerHTML = `
                    <span class="icon"><i class="fa-solid fa-tower-broadcast"></i></span>
                    <div class="info">
                        <span class="name">${ch.name}</span>
                        <span class="group">${ch.group || 'Général'}</span>
                    </div>
                `;
                item.onclick = () => {
                    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    playChannel(ch.url, ch.name, ch.group);
                };
                channelsList.appendChild(item);
            });
        }

        // دالة تشغيل القناة باستخدام البروكسي المدمج
        function playChannel(url, name, group) {
            activeName.textContent = name;
            activeGroup.textContent = group || '-';

            currentOriginalUrl = url;
            proxyIndex = 0; // البدء من البروكسي الأول

            // تمرير الرابط عبر البروكسي التلقائي
            let finalUrl = proxies[proxyIndex](url);

            if (player) {
                player.src({
                    src: finalUrl,
                    type: 'application/x-mpegURL'
                });
                player.play().catch(err => {
                    console.warn("تنبيه التشغيل التلقائي:", err);
                });
            }
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const lines = evt.target.result.split(/\r?\n/);
                const channels = [];
                let currentName = '';
                let currentGroup = 'Général';

                lines.forEach(line => {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const nameMatch = line.match(/,([^,]+)$/);
                        if (nameMatch) currentName = nameMatch[1].trim();
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        if (groupMatch) currentGroup = groupMatch[1].trim();
                    } else if (line && !line.startsWith('#') && currentName) {
                        channels.push({ name: currentName, url: line, group: currentGroup });
                        currentName = '';
                    }
                });

                if (channels.length > 0) {
                    loadChannels(channels);
                    fileStatus.innerHTML = `<i class="fa-regular fa-circle-check"></i> ${file.name} (${channels.length} قناة)`;
                } else {
                    alert('لم يتم العثور على قنوات صالحة داخل الملف.');
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
